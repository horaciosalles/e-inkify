<title>Pixel Exato</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Atkinson+Hyperlegible:wght@400;700&display=swap">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500&display=swap">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Source+Serif+4:wght@300;400;600;700&family=IBM+Plex+Sans:wght@300;400;500;700&display=swap">
<style>
/* Layout: ferramenta de tela única — controles compactos no topo, canvas 1:1 ocupa o resto, lupa flutuante. Tema escuro único, de propósito (resultado 1 bit: tinta clara sobre preto). */
:root{
  --bg:#000;
  --panel:#0c0c0c;
  --line:#242424;
  --fg:#a9a9a9;
  --muted:#626262;
  --accent:#d6d6d6;
  --ok:#6f9a6f;
  --warn:#b08a3c;
  --ui:"Atkinson Hyperlegible",system-ui,sans-serif;
  --mono:"IBM Plex Mono",ui-monospace,monospace;
  color-scheme:dark;
}
html,body{height:100%}
html{background:var(--bg)}
body{background:var(--bg);color:var(--fg);font-family:var(--ui);font-size:14px;margin:0;
  display:flex;flex-direction:column;box-sizing:border-box;
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:8px}
.bar{display:flex;flex-direction:column;gap:8px;padding-bottom:8px}
.r{display:flex;flex-wrap:wrap;gap:6px 8px;align-items:center}
.seg{display:flex;gap:4px;flex-wrap:wrap}
.seg input{position:absolute;opacity:0;pointer-events:none}
.seg label,button,.file{font:inherit;font-size:13px;color:var(--muted);background:var(--panel);border:1px solid var(--line);border-radius:8px;padding:7px 10px;cursor:pointer;line-height:1.2;white-space:nowrap}
.seg input:checked+label{color:var(--accent);border-color:var(--muted)}
.seg input:focus-visible+label,button:focus-visible,input:focus-visible,summary:focus-visible,.file:focus-within{outline:2px solid var(--accent);outline-offset:2px}
button:active{color:var(--accent)}
button.go{color:var(--accent);border-color:var(--muted)}
.file input{position:absolute;opacity:0;width:1px;height:1px}
.lab{font-size:11px;letter-spacing:.12em;text-transform:uppercase;color:var(--muted)}
.ctl{display:flex;align-items:center;gap:8px;flex:1 1 170px;min-width:0}
.ctl input[type=range]{flex:1;min-width:0;accent-color:var(--fg);margin:0;height:26px}
.v{font-family:var(--mono);font-size:12px;color:var(--fg);font-variant-numeric:tabular-nums;min-width:3.2em;text-align:right}
details{border-top:1px solid var(--line);padding-top:6px}
summary{cursor:pointer;color:var(--muted);font-size:13px;list-style-position:inside}
details .r{margin-top:6px}
input[type=color]{width:38px;height:31px;padding:3px;background:var(--panel);border:1px solid var(--line);border-radius:8px;cursor:pointer}
#txt{flex:1 1 140px;min-width:0;font:inherit;font-size:14px;color:var(--fg);background:var(--panel);border:1px solid var(--line);border-radius:8px;padding:7px 10px}
.status{font-family:var(--mono);font-size:11px;color:var(--muted);font-variant-numeric:tabular-nums;display:flex;flex-wrap:wrap;gap:3px 14px;min-width:0}
.status b{font-weight:500;color:var(--fg)}
.ok{color:var(--ok)} .warn{color:var(--warn)}
.stage{position:relative;flex:1 1 auto;min-height:120px;border:1px solid var(--line);border-radius:6px;overflow:hidden}
#cv{display:block;width:100%;height:100%;touch-action:none;image-rendering:pixelated;cursor:crosshair;background:#000}
.lwrap{position:absolute;right:8px;top:8px;width:384px;pointer-events:none}
.lbox{position:relative}
.lgrip{position:absolute;left:0;bottom:0;width:24px;height:24px;pointer-events:auto;touch-action:none;cursor:nesw-resize;
  border-left:3px solid var(--muted);border-bottom:3px solid var(--muted);border-bottom-left-radius:6px;box-sizing:border-box}
.lgrip:hover,.lgrip:active{border-color:var(--accent)}
#loupe{display:block;width:100%;aspect-ratio:1;border:1px solid var(--muted);border-radius:6px;background:#000;image-rendering:pixelated;box-sizing:border-box}
.lcap{font-family:var(--mono);font-size:10px;color:var(--muted);text-align:center;margin-top:2px}
</style>

<div class="bar">
  <div class="r">
    <div class="seg" role="radiogroup" aria-label="Vista">
      <input type="radio" name="view" id="vImg" value="img"><label for="vImg">Imagem</label>
      <input type="radio" name="view" id="vGrid" value="grid"><label for="vGrid">Médias</label>
      <input type="radio" name="view" id="vEdge" value="edges" checked><label for="vEdge">Resultado</label>
    </div>
    <button type="button" class="go" id="run">▶ Passo a passo</button>
  </div>

  <div class="r">
    <div class="ctl"><label class="lab" for="grp">grupo</label><input type="range" id="grp" min="1" max="8" step="1" value="1"><span class="v" id="vGrp">1 px</span></div>
    <div class="ctl"><label class="lab" for="ring">anéis</label><input type="range" id="ring" min="1" max="12" step="1" value="1"><span class="v" id="vRing">1 · 8</span></div>
    <div class="ctl"><label class="lab" for="thr2">contraste</label><input type="range" id="thr2" min="0" max="1" step="0.01" value="0.2"><span class="v" id="vThr2">0,20</span></div>
  </div>

  <div class="r">
    <div class="seg"><input type="checkbox" id="aa"><label for="aa">AA diagonal</label></div>
    <label class="lab" for="ink">tinta</label><input type="color" id="ink" value="#ffffff">
  </div>

  <div class="r">
    <span class="lab">imagem</span>
    <button type="button" id="bTest">Teste</button>
    <label class="file" for="photo">Foto…<input type="file" id="photo" accept="image/*"></label>
    <div class="seg" role="radiogroup" aria-label="Escala da foto">
      <input type="radio" name="fit" id="f11" value="1" checked><label for="f11">1:1</label>
      <input type="radio" name="fit" id="fFit" value="fit"><label for="fFit">Encaixar</label>
    </div>
    <button type="button" id="bCheck">Xadrez 1</button>
    <button type="button" id="bClear">Limpar</button>
  </div>

  <details>
    <summary>Desenhar na imagem</summary>
    <div class="r">
      <div class="seg" role="radiogroup" aria-label="Ferramenta">
        <input type="radio" name="tool" id="tPen" value="pen" checked><label for="tPen">Caneta</label>
        <input type="radio" name="tool" id="tErase" value="erase"><label for="tErase">Borracha</label>
        <input type="radio" name="tool" id="tText" value="text"><label for="tText">Texto</label>
      </div>
      <span class="lab">traço</span>
      <div class="seg" role="radiogroup" aria-label="Espessura em pixels físicos">
        <input type="radio" name="bs" id="b1" value="1"><label for="b1">1</label>
        <input type="radio" name="bs" id="b2" value="2"><label for="b2">2</label>
        <input type="radio" name="bs" id="b4" value="4" checked><label for="b4">4</label>
        <input type="radio" name="bs" id="b8" value="8"><label for="b8">8</label>
      </div>
    </div>
    <div class="r">
      <input id="txt" type="text" value="E-inkify" aria-label="Texto a escrever">
      <div class="ctl"><label class="lab" for="tsize">altura</label><input id="tsize" type="range" min="6" max="160" step="1" value="48"><span class="v" id="vts">48 px</span></div>
    </div>
  </details>

  <div class="status" aria-live="polite">
    <span>DPR <b id="sDpr">—</b></span>
    <span>canvas <b id="sDev">—</b></span>
    <span>grupos <b id="sGrid">—</b></span>
    <span>grupos acesos <b id="sOn">—</b></span>
    <span id="sExact">—</span>
  </div>
  <div class="status" aria-live="polite">
    <span>pixel <b id="sPx">—</b></span>
    <span id="sKind">toque no canvas para inspecionar</span>
  </div>
</div>

<div class="stage">
  <canvas id="cv" aria-label="Canvas em pixels físicos"></canvas>
  <div class="lwrap" id="lwrap">
    <div class="lbox"><canvas id="loupe" aria-hidden="true"></canvas><div class="lgrip" id="lgrip" title="Arraste para redimensionar a lupa"></div></div>
    <div class="lcap">lupa 8× · toque para fixar</div>
  </div>
</div>

<script>
(function(){
  function $(id){return document.getElementById(id)}
  function radio(n){var e=document.querySelector('input[name='+n+']:checked');return e?e.value:null}
  function setRadio(n,v){var e=document.querySelector('input[name='+n+'][value="'+v+'"]');if(e)e.checked=true}
  function fmt(x,n){return x.toFixed(n==null?2:n).replace('.',',')}

  var cv=$('cv'),ctx=cv.getContext('2d',{alpha:false});
  var lp=$('loupe'),lctx=lp.getContext('2d');
  var INK=0xFFFFFFFF,BG=0xFF000000; // ABGR little-endian: branco, preto
  var OUT=INK,OUTH=0xFF949494;      // cor da tinta na saída e a mesma cor com 30% da luz
  var W=0,H=0,exact=false;
  var disp=null,d32=null;   // o que aparece na tela
  var src=null,s32=null;    // a imagem de origem, 1:1
  var srcKind='test',bmp=null;
  var lx=-1,ly=-1;

  // parâmetros da regra
  var DIV=768,G=1,thr2=0.2,RING=1,aa=false; // score do pixel = (R+G+B)/768
  var bx=0,by=0,bs=new Float32Array(0),bval=new Float32Array(0),blit=new Uint8Array(0),litBlocks=0;
  var bout=new Uint8Array(0),outLit=0,outGrey=0; // saída final: 0 apagado, 1 aceso, 2 cinza

  /* ---------- imagem de origem ---------- */
  var off=document.createElement('canvas'),octx=off.getContext('2d',{willReadFrequently:true});
  // Nietzsche, Crepúsculo dos Ídolos, "Máximas e flechas" 12
  var QUOTE='Quem tem um porquê para viver suporta quase qualquer como.';
  var SERIF='"Source Serif 4",Georgia,"Times New Roman",serif',SANS='"IBM Plex Sans",system-ui,sans-serif';
  // [tamanho em px do CSS, peso]; repete em ciclo até encher o bloco
  var SERIF_SPECS=[[10,400],[12,300],[12,700],[14,400],[16,600],[18,400],[22,700],[28,300]];
  var SANS_SPECS=[[10,400],[12,300],[12,500],[14,400],[16,700],[18,300],[22,500],[28,700]];
  // Bloco de texto com quebra por palavra, preso ao retângulo; tamanhos multiplicados pelo DPR para dar o tamanho real de leitura
  function textBlock(c,fam,specs,x0,y0,x1,y1){
    var d=window.devicePixelRatio||1,maxW=x1-x0,words=QUOTE.split(' '),y=y0,n=0;
    c.save();c.beginPath();c.rect(x0,y0,maxW,y1-y0);c.clip();
    c.fillStyle='#fff';c.textBaseline='top';
    while(y<y1&&n<200){var sp=specs[n%specs.length],sz=Math.max(1,Math.round(sp[0]*d)),lh=Math.round(sz*1.3),line='';n++;
      c.font=sp[1]+' '+sz+'px '+fam;
      for(var w=0;w<words.length;w++){var t=line?line+' '+words[w]:words[w];
        if(line&&c.measureText(t).width>maxW){c.fillText(line,x0,y);y+=lh;line=words[w]}else line=t}
      c.fillText(line,x0,y);y+=lh+Math.round(sz*0.5)}
    c.restore();
  }
  function paintSource(){
    off.width=W;off.height=H;
    var c=octx;c.fillStyle='#000';c.fillRect(0,0,W,H);
    if(srcKind==='test'){
      var s=Math.min(W,H),r=Math.min(s*0.15,H*0.065);
      var g=c.createLinearGradient(0,0,W,0);g.addColorStop(0,'#000');g.addColorStop(1,'#fff');
      c.fillStyle=g;c.fillRect(0,0,W,Math.round(H*0.06));
      for(var k=0;k<10;k++){var v=Math.round(255*k/9);c.fillStyle='rgb('+v+','+v+','+v+')';c.fillRect(Math.round(W*k/10),Math.round(H*0.07),Math.ceil(W/10),Math.round(H*0.04))}
      c.fillStyle='#fff';c.beginPath();c.arc(W*0.27,H*0.19,r,0,Math.PI*2);c.fill();
      c.fillStyle='#f00';c.beginPath();c.arc(W*0.73,H*0.19,r,0,Math.PI*2);c.fill();
      c.strokeStyle='#808080';c.lineWidth=r*0.2;c.beginPath();c.arc(W*0.5,H*0.19,r*0.53,0,Math.PI*2);c.stroke();
      c.strokeStyle='#fff';c.lineWidth=1;
      for(var t=0;t<6;t++){c.beginPath();c.moveTo(W*0.05,H*(0.27+t*0.008));c.lineTo(W*0.95,H*(0.285+t*0.005));c.stroke()}
      var mx=Math.round(W*0.04);
      textBlock(c,SERIF,SERIF_SPECS,mx,Math.round(H*0.33),W-mx,Math.round(H*0.655));
      textBlock(c,SANS,SANS_SPECS,mx,Math.round(H*0.675),W-mx,Math.round(H*0.995));
    }else if(srcKind==='photo'&&bmp){
      if(radio('fit')==='fit'){var sc=Math.min(W/bmp.width,H/bmp.height),bw=bmp.width*sc,bh=bmp.height*sc;c.drawImage(bmp,(W-bw)/2,(H-bh)/2,bw,bh)}
      else c.drawImage(bmp,0,0);
    }
    src=octx.getImageData(0,0,W,H);s32=new Uint32Array(src.data.buffer);
    if(srcKind==='check'){for(var y=0;y<H;y++)for(var x=0;x<W;x++)s32[y*W+x]=((x+y)&1)?INK:BG}
  }

  /* ---------- regra: grupo n×n contra a média dos vizinhos ---------- */
  function compute(){
    bx=Math.floor(W/G);by=Math.floor(H/G);
    var n=bx*by,area=G*G*DIV,i,j,x,y;
    bs=new Float32Array(n);bval=new Float32Array(n);blit=new Uint8Array(n);litBlocks=0;
    for(j=0;j<by;j++)for(i=0;i<bx;i++){var sum=0;
      for(y=0;y<G;y++){var row=(j*G+y)*W+i*G;
        for(x=0;x<G;x++){var v=s32[row+x];sum+=(v&255)+((v>>>8)&255)+((v>>>16)&255)}}
      bs[j*bx+i]=sum/area}
    // Vizinhança = quadrado (2R+1)×(2R+1) de grupos, menos o central: R anéis ao redor.
    // Média por imagem integral. Bordas: só os vizinhos que existem.
    var R=RING,iw=bx+1,integ=new Float64Array(iw*(by+1));
    for(j=0;j<by;j++){var rs=0;for(i=0;i<bx;i++){rs+=bs[j*bx+i];integ[(j+1)*iw+i+1]=integ[j*iw+i+1]+rs}}
    for(j=0;j<by;j++)for(i=0;i<bx;i++){
      var idx=j*bx+i,s=bs[idx],x0=Math.max(0,i-R),x1=Math.min(bx-1,i+R),y0=Math.max(0,j-R),y1=Math.min(by-1,j+R);
      var cnt=(x1-x0+1)*(y1-y0+1)-1,val=0;
      if(cnt>0){
        var tot=integ[(y1+1)*iw+x1+1]-integ[y0*iw+x1+1]-integ[(y1+1)*iw+x0]+integ[y0*iw+x0];
        val=s-(tot-s)/cnt; // só acende o grupo mais claro que a média dos vizinhos
      }
      bval[idx]=val;
      if(cnt>0&&val>thr2){blit[idx]=1;litBlocks++}
    }
    antialias();
  }
  /* ---------- AA diagonal: passada 3×3 sobre o resultado, um grupo = um pixel ---------- */
  //   A B C
  //   D E F    E aceso → continua aceso.
  //   G H I    E apagado → meia-tinta se D+B, B+F, F+H ou D+H estiverem acesos. Os cantos A, C, G e I não entram.
  function antialias(){
    var n=bx*by,i,j;
    bout=new Uint8Array(n);outLit=litBlocks;outGrey=0;bout.set(blit);
    if(!aa)return;
    for(j=0;j<by;j++)for(i=0;i<bx;i++){
      var o=j*bx+i;if(blit[o])continue;
      var B=j>0&&blit[o-bx],H=j<by-1&&blit[o+bx],D=i>0&&blit[o-1],F=i<bx-1&&blit[o+1];
      if((D&&B)||(B&&F)||(F&&H)||(D&&H)){bout[o]=2;outGrey++}
    }
  }
  function render(){
    if(!W)return;
    var view=radio('view'),i,j,x,y;
    if(view==='img')d32.set(s32);
    else{
      d32.fill(BG);
      for(j=0;j<by;j++)for(i=0;i<bx;i++){
        var c;
        if(view==='grid'){var g=Math.min(255,Math.round(bs[j*bx+i]*DIV/3));c=0xFF000000|(g<<16)|(g<<8)|g}
        else{var st=bout[j*bx+i];if(!st)continue;c=st===2?OUTH:OUT}
        for(y=0;y<G;y++){var row=(j*G+y)*W+i*G;for(x=0;x<G;x++)d32[row+x]=c}
      }
    }
    ctx.putImageData(disp,0,0);
    drawLoupe();status();
  }

  var pending=0;
  function update(){
    if(pending)return;
    pending=requestAnimationFrame(function(){pending=0;compute();render()});
  }

  /* ---------- tamanho físico ---------- */
  function resize(w,h){
    w=Math.max(1,w|0);h=Math.max(1,h|0);if(w===W&&h===H)return;
    W=w;H=h;cv.width=W;cv.height=H;ctx.imageSmoothingEnabled=false;
    disp=ctx.createImageData(W,H);d32=new Uint32Array(disp.data.buffer);
    paintSource();compute();render();
  }
  var ro=new ResizeObserver(function(es){
    var e=es[0],w,h;
    if(e.devicePixelContentBoxSize&&e.devicePixelContentBoxSize[0]){w=e.devicePixelContentBoxSize[0].inlineSize;h=e.devicePixelContentBoxSize[0].blockSize;exact=true}
    else{var d=window.devicePixelRatio||1;w=Math.round(e.contentRect.width*d);h=Math.round(e.contentRect.height*d);exact=false}
    resize(w,h);status();sizeLoupe();
  });
  try{ro.observe(cv,{box:'device-pixel-content-box'})}catch(err){ro.observe(cv)}

  function status(){
    var dpr=window.devicePixelRatio||1;
    $('sDpr').textContent=fmt(dpr,3).replace(/,?0+$/,'');
    $('sDev').textContent=W+'×'+H;
    $('sGrid').textContent=bx+'×'+by;
    $('sOn').textContent=outLit+' / '+(bx*by)+(aa?' · meia-tinta '+outGrey:'');
    var s=$('sExact');
    if(exact){s.className='ok';s.textContent='1:1 garantido'}else{s.className='warn';s.textContent='1:1 estimado'}
  }

  /* ---------- inspeção ---------- */
  function readout(x,y){
    if(x<0||y<0||x>=W||y>=H)return;
    $('sPx').textContent='('+x+', '+y+')';
    var i=Math.floor(x/G),j=Math.floor(y/G);
    if(i>=bx||j>=by){$('sKind').textContent='fora da grade de grupos';return}
    var v=s32[y*W+x],r=v&255,g=(v>>>8)&255,b=(v>>>16)&255,k=j*bx+i;
    $('sKind').textContent='grupo ('+i+', '+j+') score '+fmt(bs[k],3)+' · contraste com '+((2*RING+1)*(2*RING+1)-1)+' vizinhos '+fmt(bval[k],3)+' → '+(blit[k]?'aceso':'apagado')+(aa?' · AA → '+['apagado','aceso','meia-tinta (canto entre vizinhos acesos)'][bout[k]]:'')+' · pixel RGB '+r+','+g+','+b;
  }

  /* ---------- desenho na imagem de origem ---------- */
  function stamp(x,y,s,c){var o=(s/2)|0;
    for(var j=0;j<s;j++){var yy=y-o+j;if(yy<0||yy>=H)continue;
      for(var i=0;i<s;i++){var xx=x-o+i;if(xx<0||xx>=W)continue;s32[yy*W+xx]=c}}}
  function line(x0,y0,x1,y1,s,c){var dx=Math.abs(x1-x0),dy=-Math.abs(y1-y0),sx=x0<x1?1:-1,sy=y0<y1?1:-1,err=dx+dy;
    for(;;){stamp(x0,y0,s,c);if(x0===x1&&y0===y1)break;var e2=2*err;if(e2>=dy){err+=dy;x0+=sx}if(e2<=dx){err+=dx;y0+=sy}}}
  function toDev(ev){var r=cv.getBoundingClientRect();return [Math.floor((ev.clientX-r.left)/r.width*W),Math.floor((ev.clientY-r.top)/r.height*H)]}
  var tcv=document.createElement('canvas'),tctx=tcv.getContext('2d',{willReadFrequently:true});
  function writeText(x,y){
    var t=$('txt').value;if(!t)return;
    var sz=+$('tsize').value,font='700 '+sz+'px "Atkinson Hyperlegible",system-ui,sans-serif';
    tctx.font=font;var w=Math.ceil(tctx.measureText(t).width)+4,h=Math.ceil(sz*1.4)+4;
    tcv.width=w;tcv.height=h;tctx.font=font;tctx.fillStyle='#fff';var base=Math.ceil(sz*1.05)+2;tctx.fillText(t,2,base);
    var d=tctx.getImageData(0,0,w,h).data,ox=x-2,oy=y-base;
    for(var j=0;j<h;j++){var yy=oy+j;if(yy<0||yy>=H)continue;
      for(var i=0;i<w;i++){var xx=ox+i;if(xx<0||xx>=W)continue;if(d[(j*w+i)*4+3]>=128)s32[yy*W+xx]=INK}}
  }

  var drawing=false,lastX=0,lastY=0,inspecting=false;
  cv.addEventListener('pointerdown',function(ev){
    var p=toDev(ev),tool=radio('tool'),drawMode=document.querySelector('details').open;
    lx=p[0];ly=p[1];readout(p[0],p[1]);
    try{cv.setPointerCapture(ev.pointerId)}catch(e){}
    ev.preventDefault();
    if(!drawMode){inspecting=true;drawLoupe();return}
    if(tool==='text'){writeText(p[0],p[1]);update();return}
    drawing=true;lastX=p[0];lastY=p[1];
    stamp(p[0],p[1],+radio('bs'),tool==='erase'?BG:INK);update();
  });
  cv.addEventListener('pointermove',function(ev){
    var evs=(ev.getCoalescedEvents&&ev.getCoalescedEvents())||[];if(!evs.length)evs=[ev];
    var s=+radio('bs'),c=radio('tool')==='erase'?BG:INK;
    // lupa e leitura ficam presas ao ponto tocado; só andam enquanto o dedo ou botão está pressionado
    if(!drawing&&!inspecting)return;
    for(var k=0;k<evs.length;k++){var p=toDev(evs[k]);lx=p[0];ly=p[1];
      if(drawing){line(lastX,lastY,p[0],p[1],s,c);lastX=p[0];lastY=p[1]}}
    readout(lx,ly);
    if(drawing)update();else drawLoupe();
  });
  function stop(){drawing=false;inspecting=false}
  cv.addEventListener('pointerup',stop);cv.addEventListener('pointercancel',stop);

  /* ---------- lupa: até 48×48 px físicos, cada um com 8 px do CSS ---------- */
  function drawLoupe(){
    var d=window.devicePixelRatio||1,css=lp.parentNode.clientWidth||384,n=Math.max(2,Math.floor(css/16)*2),size=Math.round(css*d);
    if(lp.width!==size){lp.width=size;lp.height=size}
    lctx.imageSmoothingEnabled=false;lctx.fillStyle='#000';lctx.fillRect(0,0,size,size);
    if(!W)return;
    var cx=lx<0?W>>1:lx,cy=ly<0?H>>1:ly;
    lctx.drawImage(cv,cx-n/2,cy-n/2,n,n,0,0,size,size);
    var c=size/n;lctx.strokeStyle='rgba(255,64,64,.9)';lctx.lineWidth=Math.max(1,Math.round(d));
    lctx.strokeRect(Math.round(c*n/2),Math.round(c*n/2),Math.round(c),Math.round(c));
  }

  // Tamanho da lupa em px do CSS: arrasta-se o canto inferior esquerdo (a lupa fica presa no canto superior direito).
  var LSIZE=384;
  try{var ls=+localStorage.getItem('lupa');if(ls>0)LSIZE=ls}catch(e){}
  function sizeLoupe(){
    var max=Math.max(96,cv.clientWidth-16);
    $('lwrap').style.width=Math.round(Math.max(96,Math.min(LSIZE,max)))+'px';drawLoupe();
  }
  (function(){
    var g=$('lgrip'),sx=0,sy=0,sw=0,on=false;
    g.addEventListener('pointerdown',function(ev){on=true;sx=ev.clientX;sy=ev.clientY;sw=$('lwrap').offsetWidth;
      try{g.setPointerCapture(ev.pointerId)}catch(e){}ev.preventDefault();ev.stopPropagation()});
    g.addEventListener('pointermove',function(ev){if(!on)return;
      var dx=sx-ev.clientX,dy=ev.clientY-sy; // esquerda ou baixo aumentam; vale o eixo que andou mais
      LSIZE=Math.max(96,Math.min(sw+(Math.abs(dx)>Math.abs(dy)?dx:dy),cv.clientWidth-16));sizeLoupe()});
    function end(){if(!on)return;on=false;try{localStorage.setItem('lupa',String(Math.round(LSIZE)))}catch(e){}}
    g.addEventListener('pointerup',end);g.addEventListener('pointercancel',end);
  })();

  /* ---------- controles ---------- */
  function readParams(){
    G=+$('grp').value;thr2=+$('thr2').value;aa=$('aa').checked;
    $('vGrp').textContent=G+' px';
    RING=+$('ring').value;var w=2*RING+1;$('vRing').textContent=RING+' · '+(w*w-1);$('vThr2').textContent=fmt(thr2,2);
  }
  // Meia-tinta = 30% da luz emitida, não 30% do valor: o canal sRGB vai a ~0,3^(1/2,2) ≈ 58%.
  var AA_LIGHT=0.3;
  function setInk(){
    var h=$('ink').value,r=parseInt(h.substr(1,2),16),g=parseInt(h.substr(3,2),16),b=parseInt(h.substr(5,2),16);
    function half(c){return Math.round(255*Math.pow(Math.pow(c/255,2.2)*AA_LIGHT,1/2.2))}
    OUT=(0xFF000000|(b<<16)|(g<<8)|r)>>>0;OUTH=(0xFF000000|(half(b)<<16)|(half(g)<<8)|half(r))>>>0;
  }
  $('ink').addEventListener('input',function(){setInk();render()});
  ['grp','thr2','ring'].forEach(function(id){$(id).addEventListener('input',function(){readParams();update()})});
  document.querySelectorAll('input[name=view],#aa').forEach(function(e){e.addEventListener('change',function(){readParams();update()})});
  document.querySelectorAll('input[name=fit]').forEach(function(e){e.addEventListener('change',function(){if(srcKind==='photo'){paintSource();update()}})});
  $('tsize').addEventListener('input',function(){$('vts').textContent=this.value+' px'});
  $('bTest').addEventListener('click',function(){srcKind='test';paintSource();update()});
  $('bCheck').addEventListener('click',function(){srcKind='check';paintSource();update()});
  $('bClear').addEventListener('click',function(){srcKind='blank';paintSource();update()});
  $('photo').addEventListener('change',function(){
    var f=this.files&&this.files[0];if(!f)return;
    createImageBitmap(f).then(function(b){bmp=b;srcKind='photo';paintSource();update()},function(){$('sKind').textContent='Não consegui abrir essa imagem. Tente um JPG ou PNG.'});
    this.value='';
  });

  var running=false;
  $('run').addEventListener('click',function(){
    if(running)return;running=true;var steps=['img','grid','edges'],k=0;
    (function next(){setRadio('view',steps[k]);update();k++;if(k<steps.length)setTimeout(next,1100);else running=false})();
  });

  readParams();setInk();
  // fontes usadas só no canvas não carregam sozinhas: pede cada peso e repinta quando chegarem
  if(document.fonts&&document.fonts.load){
    var loads=[];
    SERIF_SPECS.concat(SANS_SPECS).forEach(function(sp,i){loads.push(document.fonts.load(sp[1]+' 16px '+(i<SERIF_SPECS.length?SERIF:SANS),QUOTE))});
    Promise.all(loads).catch(function(){}).then(function(){return document.fonts.ready}).then(function(){if(srcKind==='test'&&W){paintSource();update()}});
  }
})();
</script>
